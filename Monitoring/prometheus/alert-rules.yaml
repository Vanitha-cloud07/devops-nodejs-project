apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-demo-app-alerts
  namespace: devops-demo
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: devops-demo-app
      rules:
        - alert: AppHighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5..", route!=""}[5m]))
              /
            sum(rate(http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "devops-demo-app 5xx error rate above 5%"
            description: "More than 5% of requests have returned 5xx over the last 5 minutes."

        - alert: AppDown
          expr: up{job="devops-demo-app"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "devops-demo-app target is down"
            description: "Prometheus has not been able to scrape devops-demo-app for 2 minutes."